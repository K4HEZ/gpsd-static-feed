# Recreates the static-position FIFO on boot (devtmpfs doesn't persist it).
# /dev/gpsd0 is deliberate -- whitelisted by Debian/Ubuntu's gpsd AppArmor
# profile. See README.md. install.sh substitutes @USER@.
#
# type name        mode  user   group    age  argument
p     /dev/gpsd0    0660  @USER@ dialout  -
